name: Rust tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate and export dependency lock
        run: |
          cargo test --all-targets
          echo "LOCKFILE_BEGIN"
          cat Cargo.lock
          echo "LOCKFILE_END"
